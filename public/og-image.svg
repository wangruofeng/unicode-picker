<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,Segoe UI,Roboto,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#1f2328"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- brand mark -->
  <g transform="translate(96,92)">
    <rect width="64" height="64" rx="16" fill="url(#accent)"/>
    <text x="32" y="46" font-size="38" fill="#fff" text-anchor="middle">✦</text>
  </g>
  <text x="180" y="120" fill="#e5e7eb" font-size="24" font-weight="600">Unicode 符号选择器</text>
  <text x="180" y="150" fill="#667085" font-size="16" font-family="SF Mono,Menlo,monospace" letter-spacing="2">UNICODE 17.0 · 9555 SYMBOLS</text>

  <!-- headline -->
  <text x="96" y="290" fill="#f6f7f9" font-size="74" font-weight="700" letter-spacing="-2">搜索 · 复制 · 查码点</text>
  <text x="96" y="358" fill="#9aa4b2" font-size="26">UTF-8 / HTML / CSS / JavaScript 编码一目了然</text>

  <!-- sample glyphs -->
  <g font-family="'Noto Sans Symbols 2','Segoe UI Symbol',Apple Symbols,sans-serif" font-size="56" text-anchor="middle">
    <text x="140" y="500" fill="#2563eb">→</text>
    <text x="230" y="500" fill="#7c3aed">★</text>
    <text x="320" y="500" fill="#e5e7eb">π</text>
    <text x="410" y="500" fill="#16a34a">✓</text>
    <text x="500" y="500" fill="#f59e0b">♪</text>
    <text x="590" y="500" fill="#dc2626">♥</text>
    <text x="680" y="500" fill="#e5e7eb">∞</text>
    <text x="770" y="500" fill="#2563eb">Ω</text>
    <text x="860" y="500" fill="#7c3aed">☂</text>
    <text x="950" y="500" fill="#e5e7eb">§</text>
    <text x="1040" y="500" fill="#16a34a">⌘</text>
  </g>

  <rect x="96" y="548" width="1008" height="3" rx="1.5" fill="url(#accent)" opacity="0.5"/>
  <text x="96" y="592" fill="#667085" font-size="18" font-family="SF Mono,Menlo,monospace">blog.wangruofeng007.com/unicode-picker</text>
</svg>
